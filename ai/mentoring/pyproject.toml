[project]
name = "mentoring"
version = "0.1.0"
description = "A 파트: 이력서·역량 분석, Story Bank, 적합도, 첨삭, 학습 경로"
requires-python = ">=3.13"

[tool.pytest.ini_options]
# mentoring 은 네임스페이스 패키지다 (src/mentoring/__init__.py 없음). 여러 작업이 하위 패키지를 따로 만든다
# team07_contracts 는 저장소 루트 contracts/ 에서 읽는다 (배포 때는 infra/package.sh 가 같이 묶는다)
pythonpath = ["src", "tests", "../../contracts/src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
