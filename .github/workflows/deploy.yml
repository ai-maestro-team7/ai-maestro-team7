# main에 머지되면 테스트를 통과한 경우에만 team07-api 코드를 배포한다.
# AWS는 OIDC 임시 자격 증명(액세스 키 없음). 역할은 이 저장소 main 브랜치만 받을 수 있고 코드 갱신만 할 수 있다.
# IAM·환경 변수·API 설정 변경은 여기서 하지 않는다 (infra/setup-role.sh, setup-api.sh는 사람이 실행).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".kiro/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-team07-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: github-deploy-${{ github.run_id }}
      - name: team07-api 코드 배포
        run: infra/deploy.sh
